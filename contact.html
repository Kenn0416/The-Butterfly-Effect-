<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Contact | Wildflower Collective

</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

background:#F7F3F0;

font-family:

Georgia,
serif;

color:#4B4453;

line-height:1.8;

overflow-x:hidden;

}

/* HEADER */

header{

position:sticky;

top:0;

background:

rgba(247,243,240,.95);

backdrop-filter:

blur(10px);

padding:

18px 50px;

display:flex;

justify-content:

space-between;

align-items:center;

border-bottom:

1px solid #E7DED8;

}

.logo{

font-size:1.3rem;

letter-spacing:2px;

color:#6B5B73;

}

nav a{

text-decoration:none;

margin-left:30px;

color:#6B5B73;

font-size:.9rem;

letter-spacing:2px;

}

/* CONTACT */

.contact{

max-width:700px;

margin:auto;

padding:

100px 30px;

text-align:center;

}

.contact h1{

font-size:3rem;

font-weight:300;

margin-bottom:25px;

color:#6B5B73;

}

.contact p{

margin-bottom:45px;

line-height:2;

color:#5B5760;

}

form{

display:flex;

flex-direction:column;

gap:20px;

}

input,
textarea{

padding:18px;

border:

1px solid #DCCFD7;

border-radius:20px;

background:white;

font-size:1rem;

font-family:Georgia,serif;

}

textarea{

height:180px;

resize:none;

}

button{

padding:

18px;

border:none;

background:

#7C6587;

color:white;

border-radius:40px;

cursor:pointer;

font-size:1rem;

letter-spacing:2px;

transition:.3s;

}

button:hover{

opacity:.85;

}

footer{

padding:

60px;

text-align:center;

border-top:

1px solid #E7DED8;

color:#8A7F90;

}

.signature img {
    width: 250px;
    max-width: 100%;
    height: auto;

}

.footer-image{

width:220px;

opacity:.7;

margin-bottom:20px;

}

</style>

</head>

<body>

<header>

<div class="logo">

WILDFLOWER COLLECTIVE

</div>

<nav>

<a href="index.html">

HOME

</a>

<a href="blog.html">

BLOG

</a>

<a href="about.html">

ABOUT

</a>

<a href="contact.html">

CONTACT

</a>

</nav>

</header>


<section class="contact">

<h1>

Get In Touch

</h1>

<p>

Questions,
collaboration opportunities,
or simply want to connect?

I'd love to hear from you.

</p>


<form
action="https://formsubmit.co/kendall.evans2360@gmail.com"
method="POST">

<input
type="text"
name="name"
placeholder="Your Name"
required>

<input
type="email"
name="email"
placeholder="Your Email"
required>

<textarea
name="message"
placeholder="Your Message"
required>

</textarea>

<button
type="submit">

SEND MESSAGE

</button>

</form>

</section
<footer>

<img
src="images/Footer-Image.jpg"
class="Footer-Image">

<p>

Wildflower Collective

</p>


</footer>

<footer class="site-footer">
    <p>© 2026 Wildflower Collective. All rights reserved.</p>
</footer></body>

</html>
