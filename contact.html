<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#F7F3F0;font-family:Georgia,serif;color:#663770;line-height:1.8;overflow-x:hidden;}
header{position:sticky;top:0;background:rgba(247,243,240,.95);backdrop-filter:blur(10px);padding:18px 50px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7ded8;z-index:999;}
.logo{font-size:1.3rem;letter-spacing:2px;color:#C79eb0;font-weight:300;}
nav{display:flex;gap:30px;align-items:center;}
nav a{text-decoration:none;color:#c793b0;font-size:.9rem;letter-spacing:2px;transition:.3s;white-space:nowrap;}
nav a:hover{opacity:.7;}
.contact{max-width:700px;margin:auto;padding:100px 30px;text-align:center;}
.contact h1{font-size:3rem;font-weight:300;margin-bottom:25px;color:#c79eb0;}
.contact p{margin-bottom:45px;line-height:2;color:#c79eb0;}
form{display:flex;flex-direction:column;gap:20px;}
input,textarea{padding:18px;border:1px solid #663770;border-radius:20px;background:white;font-size:1rem;font-family:Georgia,serif;color:#703765;width:100%;transition:.3s;}
input:focus,textarea:focus{outline:none;border-color:#663770;box-shadow:0 0 0 3px rgba(124,101,135,.1);}
textarea{height:180px;resize:vertical;min-height:120px;}
button{padding:18px;border:none;background:#663770;color:white;border-radius:40px;cursor:pointer;font-size:1rem;letter-spacing:2px;transition:.3s;font-weight:500;}
button:hover{opacity:.85;transform:translateY(-2px);}button:active{transform:translateY(0);}
blockquote{max-width:900px;margin:0 auto 50px;padding:40px 30px;background:white;border-radius:30px;text-align:center;font-style:italic;color:#76627E;box-shadow:0 10px 30px rgba(0,0,0,.05);}
.site-footer{max-width:900px;margin:0 auto 60px;padding:32px 24px;background:#fffaf1;border:1px solid #E7DED8;text-align:center;color:#8A7F90;letter-spacing:2px;font-size:.85rem;}
@media(max-width:1024px){.contact{padding:80px 30px;}}
@media(max-width:768px){header{padding:15px 20px;flex-direction:column;gap:12px;}.logo{font-size:1.1rem;}nav{justify-content:center;gap:18px;flex-wrap:wrap;}nav a{font-size:.8rem;letter-spacing:1px;}.contact{padding:60px 20px;}.contact h1{font-size:2.2rem;margin-bottom:20px;}.contact p{margin-bottom:30px;font-size:.95rem;}input,textarea{padding:14px;border-radius:15px;}button{padding:15px;font-size:.95rem;}blockquote{margin:0 20px 40px;padding:30px 22px;}.site-footer{margin:0 20px 40px;padding:24px 16px;font-size:.75rem;}}
@media(max-width:520px){header{padding:12px 15px;gap:8px;}.logo{font-size:.95rem;letter-spacing:1px;}nav{width:100%;gap:10px;}nav a{font-size:.65rem;letter-spacing:.5px;padding:5px 0;}.contact{padding:40px 15px;}.contact h1{font-size:1.8rem;margin-bottom:15px;line-height:1.2;}.contact p{margin-bottom:25px;font-size:.9rem;line-height:1.6;}form{gap:15px;}input,textarea{padding:12px;font-size:.95rem;border-radius:12px;}textarea{height:140px;min-height:100px;}button{padding:14px;font-size:.9rem;letter-spacing:1px;}blockquote{margin:0 15px 30px;padding:24px 18px;font-size:.9rem;}.site-footer{margin:0 15px 30px;}}
@media(max-width:360px){.logo{font-size:.85rem;letter-spacing:.5px;}nav a{font-size:.6rem;letter-spacing:.3px;}.contact{padding:30px 12px;}.contact h1{font-size:1.5rem;margin-bottom:12px;}.contact p{font-size:.85rem;margin-bottom:20px;line-height:1.5;}input,textarea{padding:10px;font-size:.9rem;border-radius:10px;}button{padding:12px;font-size:.85rem;letter-spacing:.5px;}}
</style>
