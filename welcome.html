<!DOCTYPE html>

<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{min-height:100%;}
body{min-height:100%;background:#f7f3f0;color:#663760;font-family:Georgia,serif;line-height:1.9;overflow-x:hidden;}
.welcome-page{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:7rem 1.5rem 3rem;}
.welcome-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;background:#f7f3f0;}
.welcome-page::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,243,240,.34),rgba(247,243,240,.58)),rgba(70,46,76,.14);z-index:1;}
.welcome-content{position:relative;z-index:2;width:min(820px,100%);text-align:center;color:#fffaf1;text-shadow:0 2px 24px rgba(48,32,56,.32);}
.welcome-kicker{display:block;margin-bottom:1.1rem;text-transform:uppercase;letter-spacing:4px;font-size:.78rem;color:#fffaf1;}
h1{font-size:4.6rem;font-weight:300;line-height:1.05;letter-spacing:1px;margin-bottom:1.1rem;color:#fffaf1;}
.welcome-lead{max-width:680px;margin:0 auto;font-size:1.22rem;font-style:italic;color:rgba(255,250,241,.94);line-height:1.8;}
.welcome-note{margin:1.2rem auto 0;font-size:.92rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,250,241,.86);}
.welcome-actions{display:flex;justify-content:center;gap:.9rem;flex-wrap:wrap;margin-top:2.6rem;}
.welcome-actions a{min-width:138px;padding:.82rem 1.35rem;border:1px solid rgba(255,250,241,.72);background:rgba(255,250,241,.18);backdrop-filter:blur(8px);color:#fffaf1;text-decoration:none;text-transform:uppercase;letter-spacing:2px;font-size:.78rem;transition:background .3s ease,color .3s ease,border-color .3s ease,transform .3s ease;}
.welcome-actions a:hover{background:rgba(255,250,241,.9);border-color:#fffaf1;color:#792253;transform:translateY(-3px);}
.welcome-actions a:nth-child(2):hover{color:#a76a8f;}
.welcome-actions a:nth-child(3):hover{color:#6f4a7d;}
.welcome-actions a:nth-child(4):hover{color:#4a7d6f;}
.welcome-footer{position:absolute;left:0;right:0;bottom:1.2rem;z-index:2;text-align:center;color:rgba(255,250,241,.82);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 14px rgba(48,32,56,.28);}
@media(max-width:768px){.welcome-page{padding:5.5rem 1.2rem 4rem;}h1{font-size:3rem;}.welcome-kicker{font-size:.7rem;letter-spacing:3px;}.welcome-lead{font-size:1.05rem;}.welcome-actions{gap:.75rem;margin-top:2rem;}.welcome-actions a{min-width:128px;padding:.75rem 1rem;font-size:.72rem;}}
@media(max-width:480px){.welcome-page{align-items:flex-end;padding:4rem 1rem 5.5rem;}h1{font-size:2.25rem;}.welcome-lead{font-size:.98rem;line-height:1.65;}.welcome-note{font-size:.72rem;letter-spacing:1.5px;}.welcome-actions{flex-direction:column;align-items:stretch;}.welcome-actions a{width:100%;}.welcome-footer{bottom:.8rem;font-size:.62rem;}}
</style>
</head>
<body>
<main class="welcome-page" aria-label="Welcome to Wildflower Collectives">
<video class="welcome-video" autoplay muted loop playsinline poster="homepage-bg.jpg">
<source src="flower-bg.mp4" type="video/mp4">
</video>
<section class="welcome-content">
<span class="welcome-kicker">The Butterfly Effect</span>
<h1>Wildflower Collectives</h1>
<p class="welcome-lead">Stories about grief, transformation, healing, family, and the small moments that ripple through everything we become.</p>
<p class="welcome-note">Begin wherever your heart needs to land.</p>
<div class="welcome-actions" aria-label="Enter Wildflower Collectives">
<a href="index.html">Home</a>
<a href="blog.html">Blog</a>
<a href="quotes.html">Quotes</a>
<a href="about.html">About</a>
</div>
</section>
<div class="welcome-footer">Healing. Growth. Becoming.</div>
</main>
</body>
</html>
